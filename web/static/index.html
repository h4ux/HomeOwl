<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeOwl</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#ff9f43">
</head>
<body>

<!-- ============ SIGN IN ============ -->
<section id="connect" class="connect">
  <div class="connect-card">
    <div class="brand"><img class="logo-img lg" src="icon.png" alt=""> HomeOwl</div>
    <div id="auth-box"><div class="empty">Loading…</div></div>
    <div class="alt">
      <button class="btn ghost" id="btn-demo" type="button">Preview with demo data</button>
      <label class="btn ghost file">Open saved report…<input type="file" id="f-file" accept=".json" hidden></label>
    </div>
  </div>
</section>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>
  <aside class="side">
    <div class="rail-col"><img class="logo-img rail-logo" src="icon.png" alt="HomeOwl"><div class="rail" id="rail"></div></div>
    <div class="side-col">
      <div class="brand">HomeOwl</div>
      <div class="site-chip" id="site-chip"></div>
      <a href="#" class="update-chip" id="update-chip" hidden></a>
      <button class="btn sm lock" id="btn-lock" hidden>🔒 Changes locked</button>
      <nav id="nav" aria-label="Pages"></nav>
      <div class="side-foot">
        <button class="btn ghost sm" id="btn-refresh">Refresh</button>
        <button class="btn ghost sm" id="btn-export">Save report</button>
        <button class="btn ghost sm" id="btn-logout">Sign out</button>
      </div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" class="modal" hidden><div id="modal-box" class="modal-box" role="dialog" aria-modal="true"></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="loading" class="loading" hidden><div class="spinner"></div><div id="loading-txt">Collecting configuration…</div></div>

<script src="icons.js"></script>
<script src="core.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
<script src="dnsvpn.js"></script>
<script src="settings.js"></script>
<script src="analytics.js"></script>
<script src="explore.js"></script>
<script src="updates.js"></script>
<script src="qr.js"></script>
<script src="guest.js"></script>
<script src="checkins.js"></script>
<script src="history.js"></script>
<script src="firmware.js"></script>
<script src="cameras.js"></script>
<script src="doors.js"></script>
<script src="ups.js"></script>
</body>
</html>
