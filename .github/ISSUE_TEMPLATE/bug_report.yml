name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please **don't include API keys, passwords, tokens or your public IP**. Security problems: use the Security tab instead."
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "And what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce }
  - type: input
    id: version
    attributes: { label: HomeOwl version, description: "Output of `homeowl version`" }
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: System, placeholder: "macOS 15 on Mac mini M2 / Ubuntu 24.04 on Raspberry Pi 5 / Windows 11" }
  - type: input
    id: unifi
    attributes: { label: UniFi console and Network version, placeholder: "UCG Ultra, UniFi OS 4.x, Network 9.x" }
  - type: textarea
    id: logs
    attributes: { label: Relevant log lines, render: text, description: "From Settings › Files & system › Logs (remove anything private)" }
